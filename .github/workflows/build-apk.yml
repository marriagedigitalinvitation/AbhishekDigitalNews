name: Build Abhishek Digital News APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build-android-apk:
    name: Compile Master Studio APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository Code
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. Setup Java JDK 21 (Required for Capacitor 6 & Gradle 8+)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 4. Install Dependencies
        run: npm install

      - name: 5. Initialize Fresh Capacitor Android Platform
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: 6. Inject Android Permissions, WebView Auto-Grant & Torch Bridge
        run: node patch-android.js

      - name: 7. Compile Android Debug APK via Gradle
        working-directory: ./android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 8. Prepare Final APK File
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ./Abhishek-Digital-News-Studio.apk

      - name: 9. Upload APK to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Abhishek-Digital-News-Studio-APK
          path: ./Abhishek-Digital-News-Studio.apk
          if-no-files-found: error

      - name: 10. Publish APK to GitHub Releases Automatically
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v8.0.${{ github.run_number }}
          name: "Abhishek Digital News Studio v8.0.${{ github.run_number }}"
          body: |
            ### 🎥 Abhishek Digital News - v8.0 Master PCR Studio APK
            - **Fixed Permissions**: OS Runtime + WebView WebChromeClient Auto-Grant for Camera, Mic, Rear Torch & Speech STT
            - **4-Panel Debate Matrix**: Independent Name, Party/Role, Zoom, Video/Photo & Live Guest Call
            - **Fixed Broadcast Monitor**: Top-pinned 100dvh layout that never scrolls out of sight
          files: ./Abhishek-Digital-News-Studio.apk
