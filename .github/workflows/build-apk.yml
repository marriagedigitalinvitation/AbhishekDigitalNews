name: Build Abhishek Digital News APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Compile Enterprise Studio APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. Setup Java JDK 21 (Required for Capacitor 6 / AGP 8+)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 4. Install Capacitor & Native Plugins
        run: npm install

      - name: 5. Add & Sync Android Platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: 6. Apply Native Camera, Audio & Manifest Patches
        run: node patch-android.js

      - name: 7. Grant Gradle Execute Permission & Build APK
        working-directory: ./android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 8. Rename APK for Easy Download
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ./Abhishek-Digital-News-Studio.apk

      - name: 9. Upload APK to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Abhishek-Digital-News-Studio-APK
          path: ./Abhishek-Digital-News-Studio.apk
          if-no-files-found: error

      - name: 10. Auto-Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Abhishek Digital News Studio v1.0.${{ github.run_number }}"
          body: |
            ### 🎥 Abhishek Digital News - Pro Studio Suite APK
            - **Station**: Abhishek Digital News
            - **Reporter**: Abhishek Kumar Sah | Raxaul, Bihar
            - **Features**: 60fps 720p Canvas Compositor, Front/Rear Camera Switching, PiP & Split Screen, Live Subtitles, Scrolling Breaking News Ticker, Web Audio DSP Noise Suppression, Native Android Video Share & Save.
          files: ./Abhishek-Digital-News-Studio.apk
